<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover нужен, чтобы контент мог уходить под нотч/Dynamic Island,
         а CSS safe-area-inset-* поднимал интерактив над «челюстью» айфона. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS PWA: открывается как самостоятельное приложение без UI Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRM" />

    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>CRM</title>
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Preload критичных модулей: браузер начнёт грузить их ПАРАЛЛЕЛЬНО с app.js,
         а не по waterfall (app.js → api.js → ui.js → views.js). Экономит 2-3 RTT
         на первом заходе (особенно заметно с медленным мобильным интернетом). -->
    <link rel="modulepreload" href="/js/api.js" />
    <link rel="modulepreload" href="/js/ui.js" />
    <link rel="modulepreload" href="/js/views.js" />
  </head>
  <body>
    <div id="app">
      <div class="loading">Загрузка…</div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/production-receipt.js"></script>
  </body>
</html>
